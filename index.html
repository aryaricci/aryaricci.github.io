<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Arya Ricci — creator.">
  <title>Arya Ricci | Creator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --ink: #171512;
      --muted: #68625b;
      --paper: #f6f2ec;
      --paper-bright: #fbf9f5;
      --line: rgba(23, 21, 18, 0.16);
      --accent: #b2785f;
      --header-height: 112px;
      --max-width: 1920px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper-bright);
      font-family: "DM Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .site-header {
      width: min(100%, var(--max-width));
      min-height: var(--header-height);
      margin: 0 auto;
      padding: 0 6%;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 32px;
      background: rgba(246, 242, 236, 0.96);
      border-bottom: 1px solid rgba(0,0,0,0.04);
      position: sticky;
      top: 0;
      z-index: 50;
      backdrop-filter: blur(14px);
    }

    .brand {
      display: inline-flex;
      flex-direction: column;
      gap: 3px;
      text-decoration: none;
      justify-self: start;
    }

    .brand-name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: clamp(23px, 2vw, 36px);
      letter-spacing: .03em;
      line-height: .95;
    }

    .brand-role {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .13em;
    }

    .site-nav {
      display: flex;
      align-items: center;
      gap: clamp(28px, 4vw, 58px);
    }

    .site-nav a {
      text-transform: uppercase;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .1em;
    }

    .site-nav a:hover,
    .site-nav a[aria-current="page"] {
      color: var(--accent);
    }

    .header-cta {
      justify-self: end;
      padding: 18px 24px;
      background: #090908;
      color: #fff;
      border-radius: 4px;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      transition: transform .2s ease, background .2s ease;
    }

    .header-cta:hover {
      transform: translateY(-2px);
      background: #25211d;
    }

    .menu-toggle { display: none; }

    main {
      width: min(100%, var(--max-width));
      min-height: calc(100vh - var(--header-height));
      margin: 0 auto;
      display: grid;
      place-items: center;
      padding: 60px 6%;
      overflow: hidden;
      background: var(--paper);
    }

    .coming-soon {
      width: 100%;
      min-height: 560px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      background: var(--paper-bright);
    }

    .coming-soon h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 500;
      font-size: clamp(58px, 8vw, 118px);
      line-height: .95;
      letter-spacing: -.04em;
      text-align: center;
    }

    @media (max-width: 1100px) {
      .site-header {
        grid-template-columns: 1fr auto;
        min-height: 86px;
      }

      .site-nav,
      .header-cta {
        display: none;
      }

      .menu-toggle {
        display: grid;
        gap: 6px;
        padding: 14px;
        border: 0;
        background: transparent;
        cursor: pointer;
      }

      .menu-toggle span:not(.sr-only) {
        width: 26px;
        height: 2px;
        background: var(--ink);
      }

      .site-header.is-open .site-nav {
        display: flex;
        position: absolute;
        left: 0;
        right: 0;
        top: 86px;
        flex-direction: column;
        align-items: flex-start;
        gap: 24px;
        padding: 30px 6%;
        background: var(--paper);
        border-bottom: 1px solid var(--line);
      }

      main {
        min-height: calc(100vh - 86px);
      }
    }

    @media (max-width: 780px) {
      main { padding: 36px 6%; }

      .coming-soon {
        min-height: 430px;
      }

      .coming-soon h1 {
        font-size: clamp(50px, 16vw, 78px);
      }
    }
  </style>
</head>

<body>
  <header class="site-header" id="top">
    <a class="brand" href="/">
      <span class="brand-name">ARYA RICCI</span>
      <span class="brand-role">CREATOR</span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span></span>
      <span></span>
      <span class="sr-only">Open navigation</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      <a href="/" aria-current="page">Home</a>
      <a href="/youtube/">YouTube</a>
      <a href="/journal/">Blog</a>
    </nav>

    <a class="header-cta" href="mailto:hello@aryaricci.com">Contact <span>→</span></a>
  </header>

  <main>
    <section class="coming-soon">
      <h1>Coming soon</h1>
    </section>
  </main>

  <script>
    const header = document.querySelector('.site-header');
    const toggle = document.querySelector('.menu-toggle');
    const navLinks = document.querySelectorAll('.site-nav a');

    if (header && toggle) {
      toggle.addEventListener('click', () => {
        const open = header.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded', String(open));
      });

      navLinks.forEach((link) => {
        link.addEventListener('click', () => {
          header.classList.remove('is-open');
          toggle.setAttribute('aria-expanded', 'false');
        });
      });
    }
  </script>
</body>
</html>
