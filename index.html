<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="Arya Ricci — creator.">
  <title>Arya Ricci | Creator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#1a1714;
      --muted:#6d655f;
      --paper:#f4efe8;
      --paper-bright:#fbf8f3;
      --line:rgba(26,23,20,.14);
      --maroon:#5c1526;
      --maroon-dark:#3c0d18;
      --rose:#d9b4ab;
      --gold:#b79a67;
      --tan:#c5a47f;
      --header-height:112px;
      --max-width:1920px;
    }

    *{box-sizing:border-box}

    html{scroll-behavior:smooth}

    body{
      margin:0;
      color:var(--ink);
      background:var(--paper);
      font-family:"DM Sans",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{color:inherit}

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    /* HEADER */
    .site-header{
      width:min(100%,var(--max-width));
      min-height:var(--header-height);
      margin:0 auto;
      padding:0 6%;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:32px;
      background:rgba(244,239,232,.96);
      border-bottom:1px solid rgba(0,0,0,.04);
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(14px);
    }

    .brand{
      display:inline-flex;
      flex-direction:column;
      gap:3px;
      text-decoration:none;
      justify-self:start;
    }

    .brand-name{
      color:var(--maroon-dark);
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(23px,2vw,36px);
      letter-spacing:.05em;
      line-height:.95;
    }

    .brand-role{
      font-size:11px;
      font-weight:700;
      letter-spacing:.26em;
    }

    .site-nav{
      display:flex;
      align-items:center;
      gap:clamp(28px,4vw,58px);
    }

    .site-nav a{
      position:relative;
      text-decoration:none;
      font-family:"Playfair Display",Georgia,serif;
      font-size:17px;
    }

    .site-nav a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-11px;
      height:1px;
      background:var(--maroon);
      transform:scaleX(0);
      transition:transform .2s ease;
    }

    .site-nav a:hover::after,
    .site-nav a[aria-current="page"]::after{
      transform:scaleX(1);
    }

    .header-cta{
      justify-self:end;
      padding:17px 26px;
      background:#080808;
      color:#fff;
      border-radius:2px;
      text-decoration:none;
      font-family:"Playfair Display",Georgia,serif;
      font-size:16px;
      transition:transform .2s ease,background .2s ease;
    }

    .header-cta:hover{
      transform:translateY(-2px);
      background:#26211d;
    }

    .menu-toggle{display:none}

    /* HERO */
    main{
      width:min(100%,var(--max-width));
      margin:0 auto;
      background:
        radial-gradient(circle at 15% 20%, rgba(92,21,38,.05), transparent 22%),
        radial-gradient(circle at 85% 75%, rgba(183,154,103,.08), transparent 24%),
        var(--paper-bright);
    }

    .hero{
      min-height:calc(100vh - var(--header-height));
      position:relative;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      align-items:center;
      gap:clamp(40px,6vw,90px);
      padding:clamp(58px,7vw,110px) 6%;
      overflow:hidden;
      border-bottom:26px solid var(--maroon);
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:auto auto 0 0;
      width:27%;
      height:18%;
      background:
        linear-gradient(135deg, transparent 0 22%, rgba(92,21,38,.06) 22% 23%, transparent 23% 45%, rgba(92,21,38,.06) 45% 46%, transparent 46% 100%);
      opacity:.45;
      pointer-events:none;
    }

    .copy{
      position:relative;
      z-index:3;
      max-width:800px;
    }

    .monogram{
      margin:0 0 10px 28%;
      color:rgba(183,154,103,.75);
      font-family:"Playfair Display",Georgia,serif;
      font-size:46px;
      line-height:1;
    }

    h1{
      margin:0;
      color:var(--maroon-dark);
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(76px,9vw,154px);
      font-weight:500;
      line-height:.83;
      letter-spacing:-.055em;
    }

    .rule{
      width:min(390px,70%);
      display:flex;
      align-items:center;
      gap:14px;
      margin:34px 0 22px 14%;
    }

    .rule::before,
    .rule::after{
      content:"";
      height:1px;
      flex:1;
      background:rgba(92,21,38,.42);
    }

    .rule span{
      color:var(--maroon);
      font-size:22px;
      line-height:1;
    }

    .tagline{
      margin:0 0 0 14%;
      color:var(--maroon-dark);
      font-size:11px;
      font-weight:700;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    .heart{
      margin:28px 0 0 38%;
      color:var(--gold);
      font-size:30px;
      transform:rotate(-7deg);
    }

    /* RIGHT COLLAGE */
    .visual{
      position:relative;
      min-height:620px;
    }

    .cheetah{
      position:absolute;
      width:38%;
      height:93%;
      right:-8%;
      top:3%;
      background-color:#c9ad8b;
      background-image:
        radial-gradient(ellipse at 18% 24%, #40352f 0 6px, transparent 6.5px),
        radial-gradient(ellipse at 22% 27%, transparent 0 10px, #85705f 10.5px 14px, transparent 14.5px),
        radial-gradient(ellipse at 66% 18%, #40352f 0 5px, transparent 5.5px),
        radial-gradient(ellipse at 69% 20%, transparent 0 9px, #8b715e 9.5px 13px, transparent 13.5px),
        radial-gradient(ellipse at 45% 56%, #40352f 0 6px, transparent 6.5px),
        radial-gradient(ellipse at 47% 58%, transparent 0 10px, #876f5d 10.5px 14px, transparent 14.5px),
        radial-gradient(ellipse at 82% 66%, #40352f 0 5px, transparent 5.5px),
        radial-gradient(ellipse at 84% 68%, transparent 0 9px, #866e5d 9.5px 13px, transparent 13.5px);
      background-size:
        110px 96px,110px 96px,
        120px 104px,120px 104px,
        126px 112px,126px 112px,
        105px 108px,105px 108px;
      opacity:.62;
      clip-path:polygon(10% 0,100% 0,100% 100%,0 100%,5% 70%,2% 48%,7% 30%);
    }

    .photo-card{
      position:absolute;
      width:min(500px,72%);
      aspect-ratio:4/5;
      right:8%;
      top:5%;
      padding:14px 14px 58px;
      background:#f7f3ed;
      border:1px solid rgba(26,23,20,.16);
      box-shadow:0 22px 55px rgba(39,28,24,.14);
      transform:rotate(1.8deg);
      z-index:3;
    }

    .photo-card::before{
      content:"";
      position:absolute;
      width:150px;
      height:34px;
      left:50%;
      top:-17px;
      transform:translateX(-50%) rotate(-4deg);
      background:rgba(226,205,170,.72);
      border:1px solid rgba(183,154,103,.12);
      z-index:4;
    }

    .photo{
      width:100%;
      height:100%;
      min-height:420px;
      display:grid;
      place-items:center;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at 52% 34%, rgba(255,255,255,.18), transparent 17%),
        linear-gradient(145deg,#6d3140 0%,#4b1725 38%,#2a1719 100%);
    }

    .photo::before{
      content:"AR";
      color:rgba(255,255,255,.78);
      font-family:"Playfair Display",Georgia,serif;
      font-size:84px;
      letter-spacing:.03em;
    }

    .photo::after{
      content:"";
      position:absolute;
      bottom:24px;
      color:rgba(255,255,255,.65);
      font-size:10px;
      font-weight:700;
      letter-spacing:.2em;
    }

    .note{
      position:absolute;
      right:0;
      bottom:4%;
      width:210px;
      padding:34px 28px 30px;
      background:#fbf6ee;
      border:1px solid rgba(26,23,20,.12);
      box-shadow:0 14px 35px rgba(39,28,24,.1);
      transform:rotate(2.2deg);
      z-index:5;
    }

    .note::before{
      content:"";
      position:absolute;
      width:30px;
      height:50px;
      right:18px;
      top:-24px;
      border:3px solid var(--gold);
      border-radius:16px 16px 8px 8px;
      transform:rotate(8deg);
      background:transparent;
    }

    .note p{
      margin:0;
      color:#5b514b;
      font-family:"Playfair Display",Georgia,serif;
      font-style:italic;
      font-size:22px;
      line-height:1.45;
      text-align:center;
    }

    .note .star{
      display:block;
      margin-top:18px;
      color:var(--gold);
      font-style:normal;
      font-size:22px;
    }

    .sparkle{
      position:absolute;
      color:var(--gold);
      font-family:"Playfair Display",Georgia,serif;
      line-height:1;
      z-index:6;
      user-select:none;
    }

    .s1{left:5%;top:16%;font-size:32px}
    .s2{left:15%;top:29%;font-size:18px}
    .s3{left:22%;bottom:10%;font-size:27px}
    .s4{right:6%;bottom:20%;font-size:24px}

    .flower{
      position:absolute;
      left:-7%;
      bottom:-8%;
      width:140px;
      height:140px;
      border-radius:50%;
      background:
        radial-gradient(circle at 50% 50%, #3f0f1c 0 18%, transparent 18.5%),
        radial-gradient(ellipse at 32% 38%, #5a1224 0 28%, transparent 29%),
        radial-gradient(ellipse at 68% 38%, #68182a 0 28%, transparent 29%),
        radial-gradient(ellipse at 38% 70%, #4b1020 0 31%, transparent 32%),
        radial-gradient(ellipse at 66% 68%, #5a1424 0 31%, transparent 32%);
      filter:drop-shadow(0 10px 16px rgba(60,13,24,.16));
      z-index:2;
    }

    /* MOBILE */
    @media(max-width:1100px){
      .site-header{
        grid-template-columns:1fr auto;
        min-height:86px;
      }

      .site-nav,
      .header-cta{
        display:none;
      }

      .menu-toggle{
        display:grid;
        gap:6px;
        padding:14px;
        border:0;
        background:transparent;
        cursor:pointer;
      }

      .menu-toggle span:not(.sr-only){
        width:26px;
        height:2px;
        background:var(--ink);
      }

      .site-header.is-open .site-nav{
        display:flex;
        position:absolute;
        left:0;
        right:0;
        top:86px;
        flex-direction:column;
        align-items:flex-start;
        gap:24px;
        padding:30px 6%;
        background:var(--paper);
        border-bottom:1px solid var(--line);
      }

      .site-header.is-open .site-nav a{
        font-family:"DM Sans",Arial,sans-serif;
        font-size:13px;
        font-weight:700;
        letter-spacing:.1em;
        text-transform:uppercase;
      }

      .hero{
        min-height:auto;
        grid-template-columns:1fr;
        padding-top:72px;
      }

      .copy{
        text-align:center;
        margin:0 auto;
      }

      .monogram,
      .tagline,
      .heart{
        margin-left:0;
      }

      .rule{
        margin-left:auto;
        margin-right:auto;
      }

      .visual{
        min-height:590px;
        width:min(760px,100%);
        margin:0 auto;
      }
    }

    @media(max-width:720px){
      .hero{
        padding:54px 5% 72px;
        gap:34px;
      }

      .tagline{
        font-size:9px;
        letter-spacing:.18em;
      }

      .visual{
        min-height:480px;
      }

      .photo-card{
        width:74%;
        right:9%;
      }

      .photo{
        min-height:320px;
      }

      .note{
        width:160px;
        padding:28px 18px 24px;
      }

      .note p{
        font-size:17px;
      }

      .cheetah{
        width:43%;
        right:-10%;
      }

      .flower{
        width:100px;
        height:100px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header" id="top">
    <a class="brand" href="/">
      <span class="brand-name">ARYA RICCI</span>
      <span class="brand-role">CREATOR</span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span></span>
      <span></span>
      <span class="sr-only">Open navigation</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      <a href="/" aria-current="page">Home</a>
      <a href="/youtube/">YouTube</a>
    
    </nav>

    <a class="header-cta" href="mailto:hello@aryaricci.com">Contact <span>→</span></a>
  </header>

  <main>
    <section class="hero">
      <div class="copy">
        <div class="monogram">AR ✦</div>
        <h1>Coming<br>soon.</h1>

        <div class="rule" aria-hidden="true"><span>✦</span></div>

        <p class="tagline">Stay tuned.</p>
        <div class="heart" aria-hidden="true">♡</div>
      </div>

      <div class="visual" aria-hidden="true">
        <div class="cheetah"></div>

        <div class="photo-card">
          <div class="photo"></div>
        </div>

        <div class="note">
          <p>coming<br>soon</p>
          <span class="star">✦</span>
        </div>

        <span class="sparkle s1">✦</span>
        <span class="sparkle s2">✧</span>
        <span class="sparkle s3">✦</span>
        <span class="sparkle s4">✧</span>

        <div class="flower"></div>
      </div>
    </section>
  </main>

  <script>
    const header=document.querySelector('.site-header');
    const toggle=document.querySelector('.menu-toggle');
    const navLinks=document.querySelectorAll('.site-nav a');

    if(header&&toggle){
      toggle.addEventListener('click',()=>{
        const open=header.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded',String(open));
      });

      navLinks.forEach(link=>{
        link.addEventListener('click',()=>{
          header.classList.remove('is-open');
          toggle.setAttribute('aria-expanded','false');
        });
      });
    }
  </script>
</body>
</html>
