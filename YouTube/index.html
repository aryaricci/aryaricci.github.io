<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="YouTube by Arya Ricci — coming soon.">
  <title>YouTube | Arya Ricci</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">

  <style>
    :root{
      --ink:#1a1714;
      --muted:#6d655f;
      --paper:#f4efe8;
      --paper-bright:#fbf8f3;
      --line:rgba(26,23,20,.14);
      --maroon:#5c1526;
      --maroon-dark:#3c0d18;
      --rose:#d9b4ab;
      --gold:#b79a67;
      --tan:#c5a47f;
      --header-height:112px;
      --max-width:1920px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      color:var(--ink);
      background:var(--paper);
      font-family:"DM Sans",Arial,sans-serif;
      -webkit-font-smoothing:antialiased;
    }

    a{color:inherit}

    .sr-only{
      position:absolute;
      width:1px;
      height:1px;
      padding:0;
      margin:-1px;
      overflow:hidden;
      clip:rect(0,0,0,0);
      white-space:nowrap;
      border:0;
    }

    /* SAME HEADER AS HOMEPAGE */
    .site-header{
      width:min(100%,var(--max-width));
      min-height:var(--header-height);
      margin:0 auto;
      padding:0 6%;
      display:grid;
      grid-template-columns:1fr auto 1fr;
      align-items:center;
      gap:32px;
      background:rgba(244,239,232,.96);
      border-bottom:1px solid rgba(0,0,0,.04);
      position:sticky;
      top:0;
      z-index:50;
      backdrop-filter:blur(14px);
    }

    .brand{
      display:inline-flex;
      flex-direction:column;
      gap:3px;
      text-decoration:none;
      justify-self:start;
    }

    .brand-name{
      color:var(--maroon-dark);
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(23px,2vw,36px);
      letter-spacing:.05em;
      line-height:.95;
    }

    .brand-role{
      font-size:11px;
      font-weight:700;
      letter-spacing:.26em;
    }

    .site-nav{
      display:flex;
      align-items:center;
      gap:clamp(28px,4vw,58px);
    }

    .site-nav a{
      position:relative;
      text-decoration:none;
      font-family:"Playfair Display",Georgia,serif;
      font-size:17px;
    }

    .site-nav a::after{
      content:"";
      position:absolute;
      left:0;
      right:0;
      bottom:-11px;
      height:1px;
      background:var(--maroon);
      transform:scaleX(0);
      transition:transform .2s ease;
    }

    .site-nav a:hover::after,
    .site-nav a[aria-current="page"]::after{
      transform:scaleX(1);
    }

    .header-cta{
      justify-self:end;
      padding:17px 26px;
      background:#080808;
      color:#fff;
      border-radius:2px;
      text-decoration:none;
      font-family:"Playfair Display",Georgia,serif;
      font-size:16px;
      transition:transform .2s ease,background .2s ease;
    }

    .header-cta:hover{
      transform:translateY(-2px);
      background:#26211d;
    }

    .menu-toggle{display:none}

    main{
      width:min(100%,var(--max-width));
      min-height:calc(100vh - var(--header-height));
      margin:0 auto;
      padding:34px 4%;
      background:
        radial-gradient(circle at 15% 20%, rgba(92,21,38,.05), transparent 22%),
        radial-gradient(circle at 85% 75%, rgba(183,154,103,.08), transparent 24%),
        var(--paper-bright);
    }

    .stage{
      min-height:calc(100vh - var(--header-height) - 68px);
      position:relative;
      overflow:hidden;
      display:grid;
      place-items:center;
      padding:72px 7%;
      border:1px solid var(--line);
      background:var(--paper-bright);
      isolation:isolate;
    }

    /* SUBTLE COLLAGE ACCENTS */
    .film-strip{
      position:absolute;
      left:50%;
      width:min(68%, 860px);
      transform:translateX(-50%);
      height:16px;
      display:flex;
      justify-content:center;
      gap:12px;
      overflow:hidden;
      opacity:.28;
    }

    .film-strip.top{top:24px}
    .film-strip.bottom{bottom:24px}

    .film-strip span{
      flex:0 0 30px;
      height:12px;
      border:1px solid var(--maroon);
      border-radius:2px;
    }

    .cheetah{
      position:absolute;
      width:22%;
      height:38%;
      right:-2%;
      top:9%;
      background-color:#c9ad8b;
      background-image:
        radial-gradient(ellipse at 18% 24%, #40352f 0 5px, transparent 5.5px),
        radial-gradient(ellipse at 22% 27%, transparent 0 9px, #85705f 9.5px 12px, transparent 12.5px),
        radial-gradient(ellipse at 66% 18%, #40352f 0 4px, transparent 4.5px),
        radial-gradient(ellipse at 69% 20%, transparent 0 8px, #8b715e 8.5px 11px, transparent 11.5px),
        radial-gradient(ellipse at 45% 56%, #40352f 0 5px, transparent 5.5px),
        radial-gradient(ellipse at 47% 58%, transparent 0 9px, #876f5d 9.5px 12px, transparent 12.5px);
      background-size:
        90px 82px,90px 82px,
        96px 86px,96px 86px,
        100px 90px,100px 90px;
      opacity:.6;
      transform:rotate(3deg);
      z-index:-1;
    }

    .maroon-card{
      position:absolute;
      width:24%;
      height:34%;
      left:-4%;
      bottom:8%;
      background:var(--maroon);
      transform:rotate(-3deg);
      z-index:-1;
    }

    .tape{
      position:absolute;
      width:122px;
      height:28px;
      left:18%;
      top:9%;
      background:rgba(226,205,170,.72);
      border:1px solid rgba(183,154,103,.12);
      transform:rotate(-7deg);
      z-index:2;
    }

    .content{
      position:relative;
      z-index:3;
      width:min(920px,100%);
      text-align:center;
    }

    .eyebrow{
      margin:0 0 18px;
      color:var(--gold);
      font-size:11px;
      font-weight:700;
      letter-spacing:.22em;
      text-transform:uppercase;
    }

    h1{
      margin:0;
      color:var(--maroon-dark);
      font-family:"Playfair Display",Georgia,serif;
      font-size:clamp(74px,9vw,148px);
      font-weight:500;
      line-height:.84;
      letter-spacing:-.055em;
    }

    h1 em{
      color:var(--maroon);
      font-weight:500;
    }

    .sub{
      width:min(560px,100%);
      margin:28px auto 0;
      color:var(--muted);
      font-size:15px;
      line-height:1.75;
    }

    .rule{
      width:min(390px,65%);
      display:flex;
      align-items:center;
      gap:14px;
      margin:30px auto 0;
    }

    .rule::before,
    .rule::after{
      content:"";
      height:1px;
      flex:1;
      background:rgba(92,21,38,.28);
    }

    .rule span{
      color:var(--gold);
      font-size:22px;
      line-height:1;
    }

    .note{
      margin:22px auto 0;
      width:max-content;
      max-width:100%;
      padding:9px 15px;
      background:#f7efe8;
      color:var(--maroon);
      border:1px solid rgba(92,21,38,.12);
      font-family:"Playfair Display",Georgia,serif;
      font-size:17px;
      font-style:italic;
      transform:rotate(-1.5deg);
    }

    .sparkle{
      position:absolute;
      color:var(--gold);
      font-family:"Playfair Display",Georgia,serif;
      line-height:1;
      user-select:none;
      z-index:2;
    }

    .s1{top:17%;left:9%;font-size:31px}
    .s2{top:28%;right:12%;font-size:18px}
    .s3{bottom:18%;left:15%;font-size:24px}
    .s4{bottom:14%;right:9%;font-size:34px}

    .heart{
      position:absolute;
      right:17%;
      bottom:24%;
      color:var(--rose);
      font-size:24px;
      transform:rotate(10deg);
      z-index:2;
    }

    @media(max-width:1100px){
      .site-header{
        grid-template-columns:1fr auto;
        min-height:86px;
      }

      .site-nav,
      .header-cta{
        display:none;
      }

      .menu-toggle{
        display:grid;
        gap:6px;
        padding:14px;
        border:0;
        background:transparent;
        cursor:pointer;
      }

      .menu-toggle span:not(.sr-only){
        width:26px;
        height:2px;
        background:var(--ink);
      }

      .site-header.is-open .site-nav{
        display:flex;
        position:absolute;
        left:0;
        right:0;
        top:86px;
        flex-direction:column;
        align-items:flex-start;
        gap:24px;
        padding:30px 6%;
        background:var(--paper);
        border-bottom:1px solid var(--line);
      }

      .site-header.is-open .site-nav a{
        font-family:"DM Sans",Arial,sans-serif;
        font-size:13px;
        font-weight:700;
        letter-spacing:.1em;
        text-transform:uppercase;
      }

      main{
        min-height:calc(100vh - 86px);
      }
    }

    @media(max-width:780px){
      main{padding:18px 4%}

      .stage{
        min-height:calc(100vh - 122px);
        padding:68px 8%;
      }

      .cheetah{
        width:35%;
        height:29%;
        right:-8%;
        top:8%;
      }

      .maroon-card{
        width:31%;
        height:25%;
        left:-8%;
        bottom:9%;
      }

      .tape{
        left:10%;
        top:8%;
      }

      .sub{font-size:14px}

      .s1{left:5%}
      .s2{right:6%}
      .s3{left:8%}
      .s4{right:5%}
    }
  </style>
</head>

<body>
  <header class="site-header" id="top">
    <a class="brand" href="/">
      <span class="brand-name">ARYA RICCI</span>
      <span class="brand-role">CREATOR</span>
    </a>

    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
      <span></span>
      <span></span>
      <span class="sr-only">Open navigation</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="Primary navigation">
      <a href="/">Home</a>
      <a href="/youtube/" aria-current="page">YouTube</a>
    </nav>

    <a class="header-cta" href="mailto:hello@aryaricci.com">Contact <span>→</span></a>
  </header>

  <main>
    <section class="stage">
      <div class="film-strip top" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="film-strip bottom" aria-hidden="true">
        <span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span>
      </div>

      <div class="cheetah" aria-hidden="true"></div>
      <div class="maroon-card" aria-hidden="true"></div>
      <div class="tape" aria-hidden="true"></div>

      <span class="sparkle s1" aria-hidden="true">✦</span>
      <span class="sparkle s2" aria-hidden="true">✧</span>
      <span class="sparkle s3" aria-hidden="true">✦</span>
      <span class="sparkle s4" aria-hidden="true">✧</span>
      <span class="heart" aria-hidden="true">♡</span>

      <div class="content">
        <p class="eyebrow">YouTube · video diary</p>
        <h1>Coming<br><em>soon.</em></h1>

        <div class="rule" aria-hidden="true"><span>✦</span></div>

        <p class="sub">
          Stories, experiments, reinventions, and whatever else I decide deserves a camera pointed at it.
        </p>

        <div class="note">currently being edited somewhere...</div>
      </div>
    </section>
  </main>

  <script>
    const header=document.querySelector('.site-header');
    const toggle=document.querySelector('.menu-toggle');
    const navLinks=document.querySelectorAll('.site-nav a');

    if(header&&toggle){
      toggle.addEventListener('click',()=>{
        const open=header.classList.toggle('is-open');
        toggle.setAttribute('aria-expanded',String(open));
      });

      navLinks.forEach(link=>{
        link.addEventListener('click',()=>{
          header.classList.remove('is-open');
          toggle.setAttribute('aria-expanded','false');
        });
      });
    }
  </script>
</body>
</html>
